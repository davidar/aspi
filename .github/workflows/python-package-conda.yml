name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Install SWI-Prolog
      run: |
        sudo apt-add-repository -y ppa:swi-prolog/stable
        sudo apt-get update
        sudo apt-get install -y swi-prolog
    - name: Run tests
      run: |
        uv run pytest
